<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      width: 280px;
      background: #1E1E1E;
      color: #D4D4D4;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #404040;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #007ACC 0%, #005A9E 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      color: white;
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 600;
      color: #E1E1E1;
    }

    .header-text p {
      font-size: 11px;
      color: #858585;
      margin-top: 2px;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #252526;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .toggle-label {
      font-size: 13px;
      color: #D4D4D4;
    }

    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #3C3C3C;
      border-radius: 24px;
      transition: 0.3s;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #858585;
      border-radius: 50%;
      transition: 0.3s;
    }

    input:checked + .toggle-slider {
      background-color: #007ACC;
    }

    input:checked + .toggle-slider:before {
      transform: translateX(20px);
      background-color: white;
    }

    .status {
      text-align: center;
      font-size: 11px;
      color: #858585;
      padding: 8px;
      background: #252526;
      border-radius: 6px;
    }

    .status.enabled {
      color: #4EC9B0;
    }

    .status.disabled {
      color: #858585;
    }

    .color-preview {
      margin-top: 12px;
      padding: 10px;
      background: #252526;
      border-radius: 6px;
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
    }

    .color-preview .keyword { color: #569CD6; }
    .color-preview .function { color: #DCDCAA; }
    .color-preview .string { color: #CE9178; }
    .color-preview .comment { color: #6A9955; }
    .color-preview .variable { color: #9CDCFE; }
    .color-preview .type { color: #4EC9B0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">VS</div>
    <div class="header-text">
      <h1>VS Code Dark+ for GitHub</h1>
      <p>Syntax highlighting theme</p>
    </div>
  </div>

  <div class="toggle-container">
    <span class="toggle-label">Enable theme</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggle" checked>
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div id="status" class="status enabled">Theme is active</div>

  <div class="color-preview">
    <span class="comment">// Preview</span><br>
    <span class="keyword">const</span> <span class="variable">greeting</span> = <span class="string">"Hello"</span>;<br>
    <span class="keyword">function</span> <span class="function">sayHi</span>(<span class="variable">name</span>: <span class="type">string</span>) {}
  </div>

  <script src="popup.js"></script>
</body>
</html>
